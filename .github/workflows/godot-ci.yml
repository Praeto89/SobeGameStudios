name: Godot CI

# Smoke-Test fuer jeden Push/PR: importiert das Projekt (faengt kaputte
# Ressourcen-Referenzen ab, z. B. falsche Szenen-/Skript-Pfade) und prueft
# die Syntax aller GDScript-Dateien. So landen keine nicht-oeffnenden
# Skripte oder gebrochenen Verweise in main.
#
# Hinweis: Die Godot-Version unten muss zur Engine-Version des Projekts
# passen (siehe project.godot -> config/features). Bei einem Engine-Update
# hier ebenfalls anpassen.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  import-and-check:
    name: Import & GDScript-Check
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Godot installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Godot-Version
        run: godot --version

      - name: Projekt importieren (Ressourcen-Smoke-Test)
        run: godot --headless --path . --import

      - name: GDScript-Syntax pruefen
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            echo "== check $f =="
            if ! godot --headless --path . --check-only --script "$f" --quit; then
              echo "::error file=$f::GDScript-Syntaxfehler"
              fail=1
            fi
          done < <(find scripts tests -name '*.gd')
          exit $fail

      - name: Logik-Tests ausfuehren
        run: godot --headless --path . --script res://tests/run_tests.gd
